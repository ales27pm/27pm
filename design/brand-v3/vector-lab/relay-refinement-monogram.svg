<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="680" viewBox="0 0 1440 680" role="img" aria-labelledby="title desc">
  <title id="title">27PM — affinements du symbole Relais</title>
  <desc id="desc">Trois symboles abstraits à deux formes. Une forme atteint la limite commune; l’autre la dépasse de trois vingt-quatrièmes.</desc>

  <defs>
    <!-- 01 / Emboîtement : une seule couture en losange; dépassement 12 sur base 96. -->
    <symbol id="relay-lock" viewBox="0 0 128 128">
      <path fill="currentColor" d="M28 20H58V48L78 64L58 80V116H28C18 116 12 110 12 100V36C12 26 18 20 28 20Z"/>
      <path fill="currentColor" d="M68 8H100C110 8 116 14 116 24V100C116 110 110 116 100 116H68V84L92 64L68 44Z"/>
    </symbol>

    <!-- 02 / Faille : deux masses calmes, une incision unique à 27 degrés. -->
    <symbol id="relay-fault" viewBox="0 0 128 128">
      <path fill="currentColor" d="M28 20H86V8H100C110 8 116 14 116 24V36L18 86H12V36C12 26 18 20 28 20Z"/>
      <path fill="currentColor" d="M12 98L110 48H116V100C116 110 110 116 100 116H28C18 116 12 110 12 100Z"/>
    </symbol>

    <!-- 03 / Décalage : deux tuiles horizontales; la seconde dépasse de 12 sur 96. -->
    <symbol id="relay-joint" viewBox="0 0 128 128">
      <path fill="currentColor" d="M28 12H88C98 12 104 18 104 28V58H76L64 72L52 58H12V28C12 18 18 12 28 12Z"/>
      <path fill="currentColor" d="M12 70H52L64 84L76 70H116V100C116 110 110 116 100 116H28C18 116 12 110 12 100Z"/>
    </symbol>
  </defs>

  <rect width="1440" height="680" fill="#f4f0e7"/>
  <g fill="#191816" font-family="Arial, Helvetica, sans-serif">
    <text x="72" y="64" font-size="15" font-weight="700" letter-spacing="2.5">27PM · RELAIS / REFINEMENT</text>
    <text x="72" y="109" font-size="32" font-weight="600" letter-spacing="-.9">Deux formes. Une seule anomalie.</text>
    <text x="1368" y="64" text-anchor="end" font-size="12" font-weight="700" letter-spacing="1.8">MONOCHROME · 16 PX · +3/24</text>
  </g>
  <path d="M72 146H1368" stroke="#191816" stroke-opacity=".17"/>

  <g transform="translate(72 184)">
    <rect width="400" height="408" rx="3" fill="#fffdf8" stroke="#191816" stroke-opacity=".16"/>
    <g color="#191816"><use href="#relay-lock" x="86" y="39" width="228" height="228"/></g>
    <g transform="translate(28 318)" font-family="Arial, Helvetica, sans-serif">
      <text fill="#191816" font-size="13" font-weight="700" letter-spacing="1.6">01 · EMBOÎTEMENT</text>
      <text y="30" fill="#191816" fill-opacity=".62" font-size="14">Deux masses se transmettent le même joint.</text>
      <text y="57" fill="#2846b8" font-size="11" font-weight="700" letter-spacing="1.1">ANOMALIE · LOSANGE CENTRAL</text>
    </g>
    <g transform="translate(344 324)" color="#191816">
      <rect width="28" height="28" rx="2" fill="#f4f0e7" stroke="#191816" stroke-opacity=".18"/>
      <svg x="6" y="6" width="16" height="16" viewBox="0 0 128 128"><use href="#relay-lock"/></svg>
      <text x="14" y="49" text-anchor="middle" fill="#191816" fill-opacity=".54" font-family="Arial, Helvetica, sans-serif" font-size="10">16 px</text>
    </g>
  </g>

  <g transform="translate(520 184)">
    <rect width="400" height="408" rx="3" fill="#fffdf8" stroke="#191816" stroke-opacity=".16"/>
    <g color="#191816"><use href="#relay-fault" x="86" y="39" width="228" height="228"/></g>
    <path d="M176 223L259 181" stroke="#2846b8" stroke-width="1.2" stroke-opacity=".8"/>
    <text x="266" y="181" fill="#2846b8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">27°</text>
    <g transform="translate(28 318)" font-family="Arial, Helvetica, sans-serif">
      <text fill="#191816" font-size="13" font-weight="700" letter-spacing="1.6">02 · FAILLE</text>
      <text y="30" fill="#191816" fill-opacity=".62" font-size="14">La couture traverse un volume déjà stable.</text>
      <text y="57" fill="#2846b8" font-size="11" font-weight="700" letter-spacing="1.1">ANOMALIE · COUPE À 27°</text>
    </g>
    <g transform="translate(344 324)" color="#191816">
      <rect width="28" height="28" rx="2" fill="#f4f0e7" stroke="#191816" stroke-opacity=".18"/>
      <svg x="6" y="6" width="16" height="16" viewBox="0 0 128 128"><use href="#relay-fault"/></svg>
      <text x="14" y="49" text-anchor="middle" fill="#191816" fill-opacity=".54" font-family="Arial, Helvetica, sans-serif" font-size="10">16 px</text>
    </g>
  </g>

  <g transform="translate(968 184)">
    <rect width="400" height="408" rx="3" fill="#fffdf8" stroke="#191816" stroke-opacity=".16"/>
    <g color="#191816"><use href="#relay-joint" x="86" y="39" width="228" height="228"/></g>
    <path d="M271 219H293" stroke="#2846b8" stroke-width="1.2"/>
    <path d="M271 212V226M293 212V226" stroke="#2846b8" stroke-opacity=".35"/>
    <text x="300" y="223" fill="#2846b8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">+3/24</text>
    <g transform="translate(28 318)" font-family="Arial, Helvetica, sans-serif">
      <text fill="#191816" font-size="13" font-weight="700" letter-spacing="1.6">03 · DÉCALAGE</text>
      <text y="30" fill="#191816" fill-opacity=".62" font-size="14">La seconde pièce reprend et dépasse la première.</text>
      <text y="57" fill="#2846b8" font-size="11" font-weight="700" letter-spacing="1.1">ANOMALIE · DÉPASSEMENT 1/8</text>
    </g>
    <g transform="translate(344 324)" color="#191816">
      <rect width="28" height="28" rx="2" fill="#f4f0e7" stroke="#191816" stroke-opacity=".18"/>
      <svg x="6" y="6" width="16" height="16" viewBox="0 0 128 128"><use href="#relay-joint"/></svg>
      <text x="14" y="49" text-anchor="middle" fill="#191816" fill-opacity=".54" font-family="Arial, Helvetica, sans-serif" font-size="10">16 px</text>
    </g>
  </g>

  <g transform="translate(72 642)" fill="#191816" font-family="Arial, Helvetica, sans-serif">
    <text font-size="12" font-weight="700" letter-spacing="1.5">FILTRE</text>
    <text x="83" font-size="12" fill-opacity=".56">Aucune lettre, flèche ou métaphore littérale; le dépassement est la seule irrégularité du contour.</text>
  </g>
</svg>
