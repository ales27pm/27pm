<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="560" viewBox="0 0 1320 560" fill="none">
  <defs>
    <!--
      A — BALANCED RELAY
      Two arms terminate on the same 24-unit radius. The third uses the same
      blunt vocabulary but exceeds that radius by 3/24. Rotation: 27 degrees.
      One continuous silhouette; no directional tip.
    -->
    <symbol id="relay-a" viewBox="-12 -12 144 144">
      <g transform="rotate(27 60 60)">
        <path d="M55 5C56.1-1.5 64-4.1 69.2-.1C72.9 2.7 74.2 7.5 72.1 11.7L67.6 45.8L101.7 57.5C109.1 60 113.5 67.7 111 75.1C108.5 82.5 100.4 86.3 93.3 83L64.8 71.4L32 103.1C26.1 108.8 16.4 108.2 11.3 101.8C6.4 95.6 8.2 86.4 15.1 82.2L46.9 56.6L47.4 18.4C47.5 11.8 50.4 6.7 55 5Z" fill="currentColor"/>
      </g>
    </symbol>

    <!--
      B — QUIET OVERRUN
      The same two equal termini are held closer to the centre. Only the third
      shoulder crosses the implied field, by 3 units after a 24-unit reach.
      The shallow valleys make the mark read as one object, not a diagram.
    -->
    <symbol id="relay-b" viewBox="-12 -12 144 144">
      <g transform="rotate(-27 60 60)">
        <path d="M56.7 4.2C59.4-1.7 67.6-2.5 71.5 2.7C74 6.1 73.8 10.8 71 14L66.5 44.5L98.8 52.9C106.3 54.8 111.4 61.5 110.8 69.2C110.2 77.2 103 83.2 95 82.4C92.2 82.1 89.6 81 87.4 79.2L64 69.3L37.6 97.8C32.1 103.7 22.7 104.2 16.6 98.9C10.1 93.3 10.1 83.2 16.6 77.6L45.9 53.8L46 22.1C46 13.8 50 6.9 56.7 4.2Z" fill="currentColor"/>
      </g>
    </symbol>

    <!--
      C — SECOND WIND
      The two equal arms and their junction are complete as one form. The idea
      resumes on the third axis after a 3-unit interruption; its final cap is
      exactly 3/24 beyond the otherwise shared radius. Two forms total.
    -->
    <symbol id="relay-c" viewBox="-12 -12 144 144">
      <g transform="rotate(27 60 60)">
        <path d="M51.3 18.5C51.5 13.1 55.2 9.4 60.2 9.4C65.3 9.4 69 13.4 68.8 18.6L66.7 45.7L99.6 56.4C107 58.8 111.4 66.4 109.2 73.9C107 81.3 99 85.4 91.8 82.4L64.6 71.3L32.3 101.5C26.4 107 17.1 106.3 12 100C7.2 94 8.7 85.1 15.2 80.8L47 56.3L51.3 18.5Z" fill="currentColor"/>
        <path d="M53.9-6.5C55.3-11 60.6-13.1 64.7-10.9C67.8-9.3 69.6-5.9 69.1-2.4L67.8 4.1C67 8.2 63.2 10.9 59.1 10.1C55 9.3 52.3 5.4 53.2 1.3L53.9-6.5Z" fill="currentColor"/>
      </g>
    </symbol>
  </defs>

  <rect width="1320" height="560" fill="#F4F1E9"/>

  <!-- Three silhouettes, with geometry-only ordinal labels. -->
  <g fill="#17192E">
    <rect x="211" y="54" width="18" height="5" rx="2.5"/>
    <rect x="644" y="54" width="12" height="5" rx="2.5"/>
    <rect x="664" y="54" width="12" height="5" rx="2.5"/>
    <rect x="1077" y="54" width="9" height="5" rx="2.5"/>
    <rect x="1094" y="54" width="9" height="5" rx="2.5"/>
    <rect x="1111" y="54" width="9" height="5" rx="2.5"/>
  </g>

  <path d="M440 40V520M880 40V520" stroke="#17192E" stroke-opacity="0.12"/>

  <g color="#17192E">
    <use href="#relay-a" x="112" y="120" width="216" height="216"/>
    <use href="#relay-b" x="552" y="120" width="216" height="216"/>
    <use href="#relay-c" x="992" y="120" width="216" height="216"/>
  </g>

  <!-- Exact 16 px silhouette checks; no containing shape. -->
  <g color="#17192E">
    <use href="#relay-a" x="212" y="407" width="16" height="16"/>
    <use href="#relay-b" x="652" y="407" width="16" height="16"/>
    <use href="#relay-c" x="1092" y="407" width="16" height="16"/>
  </g>

  <!-- Hidden construction notation: 24 + 3, kept outside every mark. -->
  <g fill="#17192E">
    <path d="M184 474H232V480H184Z"/>
    <path d="M239 474H245V480H239ZM251 474H257V480H251ZM263 474H269V480H263Z"/>
    <path d="M624 474H672V480H624Z"/>
    <path d="M679 474H685V480H679ZM691 474H697V480H691ZM703 474H709V480H703Z"/>
    <path d="M1064 474H1112V480H1064Z"/>
    <path d="M1119 474H1125V480H1119ZM1131 474H1137V480H1131ZM1143 474H1149V480H1143Z"/>
  </g>
</svg>
