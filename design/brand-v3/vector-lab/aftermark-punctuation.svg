<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="680" viewBox="0 0 1440 680" role="img" aria-labelledby="title desc">
  <title id="title">27PM — ponctuation après le point final</title>
  <desc id="desc">Quatre glyphes organiques monochromes exprimant une fin attendue suivie d'une reprise calme.</desc>

  <defs>
    <!-- 01 / Graine : la masse s'immobilise; un germe reprend sa tangente. -->
    <symbol id="after-seed" viewBox="0 0 140 128">
      <path fill="currentColor" d="M16 91C16 70 30 52 52 37C69 26 83 22 94 28C106 34 109 47 103 58C99 66 91 71 82 76L51 95C43 100 39 108 37 117C24 114 16 104 16 91Z"/>
      <path fill="currentColor" d="M105 17C111 9 121 8 127 14C133 20 130 29 122 35C115 40 106 38 102 32C99 27 101 22 105 17Z"/>
    </symbol>

    <!-- 02 / Reprise : deux terminaisons cousines, jamais deux points identiques. -->
    <symbol id="after-resume" viewBox="0 0 140 128">
      <path fill="currentColor" d="M14 76C14 55 27 34 47 20C61 10 77 9 87 18C98 28 96 44 85 55C73 67 57 72 45 83C36 91 31 102 30 116C20 108 14 94 14 76Z"/>
      <path fill="currentColor" d="M92 77C100 68 113 65 122 71C132 78 133 91 126 101C118 112 104 116 93 110C82 104 82 88 92 77Z"/>
    </symbol>

    <!-- 03 / Césure : une seule incision fait croire à la fin, le contour repart. -->
    <symbol id="after-cut" viewBox="0 0 140 128">
      <path fill="currentColor" d="M16 96C16 77 27 61 44 51L75 32C85 26 90 19 92 10C106 13 115 24 115 38C115 53 107 64 94 72L80 81L96 83C108 84 116 93 116 104C116 113 111 119 103 122C95 111 85 106 72 106H49C38 106 28 110 21 117C18 111 16 104 16 96Z"/>
    </symbol>

    <!-- 04 / Écho : le terminal et sa suite partagent un galbe, pas une taille. -->
    <symbol id="after-echo" viewBox="0 0 140 128">
      <path fill="currentColor" d="M13 69C13 47 26 27 46 16C63 7 82 10 93 23C105 38 101 59 87 72C72 86 51 91 34 104C27 109 22 115 19 121C13 106 11 85 13 69Z"/>
      <path fill="currentColor" d="M103 81C111 74 122 76 128 84C134 93 131 104 122 110C113 116 102 113 98 104C94 96 97 87 103 81Z"/>
    </symbol>
  </defs>

  <rect width="1440" height="680" fill="#f4f0e7"/>
  <g fill="#191816" font-family="Arial, Helvetica, sans-serif">
    <text x="72" y="62" font-size="15" font-weight="700" letter-spacing="2.5">27PM · AFTERMARK / PUNCTUATION LAB</text>
    <text x="72" y="107" font-size="32" font-weight="600" letter-spacing="-.8">La suite après le point final.</text>
    <text x="1368" y="62" text-anchor="end" font-size="12" font-weight="700" letter-spacing="1.7">NOIR / BLANC · 1–2 FORMES · 16 PX</text>
  </g>
  <path d="M72 144H1368" stroke="#191816" stroke-opacity=".17"/>

  <g transform="translate(72 182)">
    <rect width="304" height="408" rx="3" fill="#fffdf8" stroke="#191816" stroke-opacity=".16"/>
    <g color="#191816"><use href="#after-seed" x="52" y="48" width="200" height="183"/></g>
    <g transform="translate(24 310)" font-family="Arial, Helvetica, sans-serif">
      <text fill="#191816" font-size="13" font-weight="700" letter-spacing="1.5">01 · GRAINE</text>
      <text y="30" fill="#191816" fill-opacity=".61" font-size="13">Arrêt plein, reprise sur la tangente.</text>
    </g>
    <g transform="translate(252 318)" color="#191816">
      <rect width="28" height="28" rx="2" fill="#f4f0e7" stroke="#191816" stroke-opacity=".18"/>
      <svg x="6" y="6" width="16" height="16" viewBox="0 0 140 128"><use href="#after-seed"/></svg>
      <text x="14" y="48" text-anchor="middle" fill="#191816" fill-opacity=".53" font-family="Arial, Helvetica, sans-serif" font-size="10">16 px</text>
    </g>
  </g>

  <g transform="translate(402 182)">
    <rect width="304" height="408" rx="3" fill="#fffdf8" stroke="#191816" stroke-opacity=".16"/>
    <g color="#191816"><use href="#after-resume" x="52" y="48" width="200" height="183"/></g>
    <g transform="translate(24 310)" font-family="Arial, Helvetica, sans-serif">
      <text fill="#191816" font-size="13" font-weight="700" letter-spacing="1.5">02 · REPRISE</text>
      <text y="30" fill="#191816" fill-opacity=".61" font-size="13">Deux terminaisons, deux intensités.</text>
    </g>
    <g transform="translate(252 318)" color="#191816">
      <rect width="28" height="28" rx="2" fill="#f4f0e7" stroke="#191816" stroke-opacity=".18"/>
      <svg x="6" y="6" width="16" height="16" viewBox="0 0 140 128"><use href="#after-resume"/></svg>
      <text x="14" y="48" text-anchor="middle" fill="#191816" fill-opacity=".53" font-family="Arial, Helvetica, sans-serif" font-size="10">16 px</text>
    </g>
  </g>

  <g transform="translate(732 182)">
    <rect width="304" height="408" rx="3" fill="#fffdf8" stroke="#191816" stroke-opacity=".16"/>
    <g color="#191816"><use href="#after-cut" x="52" y="48" width="200" height="183"/></g>
    <g transform="translate(24 310)" font-family="Arial, Helvetica, sans-serif">
      <text fill="#191816" font-size="13" font-weight="700" letter-spacing="1.5">03 · CÉSURE</text>
      <text y="30" fill="#191816" fill-opacity=".61" font-size="13">La fin devient un regain dans la masse.</text>
    </g>
    <g transform="translate(252 318)" color="#191816">
      <rect width="28" height="28" rx="2" fill="#f4f0e7" stroke="#191816" stroke-opacity=".18"/>
      <svg x="6" y="6" width="16" height="16" viewBox="0 0 140 128"><use href="#after-cut"/></svg>
      <text x="14" y="48" text-anchor="middle" fill="#191816" fill-opacity=".53" font-family="Arial, Helvetica, sans-serif" font-size="10">16 px</text>
    </g>
  </g>

  <g transform="translate(1062 182)">
    <rect width="306" height="408" rx="3" fill="#fffdf8" stroke="#191816" stroke-opacity=".16"/>
    <g color="#191816"><use href="#after-echo" x="53" y="48" width="200" height="183"/></g>
    <g transform="translate(24 310)" font-family="Arial, Helvetica, sans-serif">
      <text fill="#191816" font-size="13" font-weight="700" letter-spacing="1.5">04 · ÉCHO</text>
      <text y="30" fill="#191816" fill-opacity=".61" font-size="13">Le terminal produit une suite plus calme.</text>
    </g>
    <g transform="translate(254 318)" color="#191816">
      <rect width="28" height="28" rx="2" fill="#f4f0e7" stroke="#191816" stroke-opacity=".18"/>
      <svg x="6" y="6" width="16" height="16" viewBox="0 0 140 128"><use href="#after-echo"/></svg>
      <text x="14" y="48" text-anchor="middle" fill="#191816" fill-opacity=".53" font-family="Arial, Helvetica, sans-serif" font-size="10">16 px</text>
    </g>
  </g>

  <g transform="translate(72 640)" fill="#191816" font-family="Arial, Helvetica, sans-serif">
    <text font-size="12" font-weight="700" letter-spacing="1.5">FILTRE</text>
    <text x="83" font-size="12" fill-opacity=".56">Ni lettre, ni ponctuation connue, ni métaphore littérale : seulement l’arrêt et la reprise.</text>
  </g>
</svg>
