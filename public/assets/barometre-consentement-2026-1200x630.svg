<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Baromètre 27PM 2026 sur le refus au clavier</title>
  <desc id="description">Brouillon méthodologique du Baromètre 27PM 2026. Recollecte v2 requise; aucun résultat publié.</desc>
  <rect width="1200" height="630" fill="#F4F0E7"/>
  <rect x="64" y="64" width="1072" height="502" fill="none" stroke="#171714" stroke-width="2"/>
  <rect x="64" y="64" width="18" height="502" fill="#2846B8"/>
  <g fill="#171714" font-family="Arial, Helvetica, sans-serif">
    <text x="126" y="130" font-size="28" font-weight="700" letter-spacing="2">27PM · BAROMÈTRE 2026</text>
    <text x="126" y="226" font-size="61" font-weight="700">Le droit de refuser</text>
    <text x="126" y="296" font-size="61" font-weight="700">fonctionne-t-il au clavier?</text>
    <text x="126" y="364" font-size="26">Protocole mobile en révision · SIT Québec</text>
    <text x="126" y="512" font-size="21">Aucun classement · Aucun verdict juridique</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(126 406)">
      <text fill="#2846B8" font-size="34" font-weight="700">BROUILLON</text>
      <text x="244" y="-3" fill="#171714" font-size="19">recollecte v2 requise</text>
      <text x="244" y="22" fill="#171714" font-size="19">aucun résultat publié</text>
    </g>
  </g>
</svg>
