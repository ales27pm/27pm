<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Baromètre 27PM 2026 sur le refus au clavier</title>
  <desc id="description">Image sociale du Baromètre 27PM 2026 : 60 pages échantillonnées, 53 analysables et une bannière détectée sur 20 de ces 53 pages.</desc>
  <rect width="1200" height="630" fill="#F4F0E7"/>
  <rect x="64" y="64" width="1072" height="502" fill="none" stroke="#171714" stroke-width="2"/>
  <rect x="64" y="64" width="18" height="502" fill="#2846B8"/>
  <g fill="#171714" font-family="Arial, Helvetica, sans-serif">
    <text x="126" y="130" font-size="28" font-weight="700" letter-spacing="2">27PM · BAROMÈTRE 2026</text>
    <text x="126" y="218" font-size="61" font-weight="700">Le droit de refuser</text>
    <text x="126" y="288" font-size="61" font-weight="700">fonctionne-t-il au clavier?</text>
    <text x="126" y="342" font-size="23">Observation automatisée mobile · SIT Québec · 11 octobre 2026</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(126 402)">
      <text fill="#2846B8" font-size="46" font-weight="700">60</text>
      <text x="0" y="32" fill="#171714" font-size="18">pages échantillonnées</text>
    </g>
    <g transform="translate(442 402)">
      <text fill="#2846B8" font-size="46" font-weight="700">53</text>
      <text x="0" y="32" fill="#171714" font-size="18">pages analysables</text>
    </g>
    <g transform="translate(744 402)">
      <text fill="#2846B8" font-size="46" font-weight="700">20/53</text>
      <text x="0" y="32" fill="#171714" font-size="18">bannières détectées</text>
    </g>
  </g>
  <text x="126" y="520" fill="#171714" font-family="Arial, Helvetica, sans-serif" font-size="21">Aucun classement · Aucun verdict de conformité</text>
</svg>
